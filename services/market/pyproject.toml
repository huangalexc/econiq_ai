[project]
name = "econiq-market"
version = "0.1.0"
description = "Market data ingestion (Tiingo) with point-in-time integrity"
requires-python = ">=3.12"
dependencies = [
    "econiq-ontology",
    "econiq-data-models",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "duckdb>=1.1",
    "polars>=1.9",
]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-data-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_market"]
