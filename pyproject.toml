[project]
name = "econiq-ai"
version = "0.1.0"
description = "Evidence-backed, Process-first investment research platform"
requires-python = ">=3.12"
dependencies = [
    "econiq-ontology",
    "econiq-schemas",
    "econiq-data-models",
    "econiq-llm",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-psycopg2>=2.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/ontology",
    "packages/schemas",
    "packages/data-models",
    "packages/llm",
]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-schemas = { workspace = true }
econiq-data-models = { workspace = true }
econiq-llm = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/data-models/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "ANN"]
ignore = [
    "ANN401",
    "B008",
    # Spec references are written with en dashes ("ontology §4–§6"); keeping
    # them matches the source documents.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/ontology/src",
    "packages/schemas/src",
    "packages/data-models/src",
    "packages/llm/src",
]
explicit_package_bases = true
disallow_untyped_decorators = false
# Type-check the contract, not the tests: strict mode on test helpers costs more
# in annotation noise than it catches. Tests are still linted and run.
exclude = ["/tests/", "/alembic/versions/"]

[[tool.mypy.overrides]]
# The provider SDK is an optional extra; the import is guarded at runtime.
module = ["anthropic.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
markers = [
    "integration: requires the docker-compose stack (Postgres/MinIO/Redis)",
]
filterwarnings = ["error::DeprecationWarning"]

