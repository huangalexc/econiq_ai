[project]
name = "econiq-llm"
version = "0.1.0"
description = "LLM provider abstraction, agent runtime and prompt versioning"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "econiq-ontology",
    "econiq-schemas",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_llm"]
