[project]
name = "econiq-ontology"
version = "0.1.0"
description = "Canonical Pydantic ontology for the econiq research platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_ontology"]
