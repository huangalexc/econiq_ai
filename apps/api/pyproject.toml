[project]
name = "econiq-api"
version = "0.1.0"
description = "FastAPI domain API over the ontology"
requires-python = ">=3.12"
dependencies = [
    "econiq-ontology",
    "econiq-data-models",
    "econiq-graph",
    "econiq-agents",
    "pyjwt[crypto]>=2.9",
    "econiq-orchestration",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-data-models = { workspace = true }
econiq-graph = { workspace = true }
econiq-agents = { workspace = true }
econiq-orchestration = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_api"]
