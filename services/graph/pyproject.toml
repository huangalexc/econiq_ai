[project]
name = "econiq-graph"
version = "0.1.0"
description = "Traversal and integrity queries over the ontology graph"
requires-python = ">=3.12"
dependencies = ["econiq-ontology", "econiq-data-models"]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-data-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_graph"]
