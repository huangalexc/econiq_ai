[project]
name = "econiq-agents"
version = "0.1.0"
description = "Agent implementations over the shared LLM runtime"
requires-python = ">=3.12"
dependencies = [
    "econiq-ontology",
    "econiq-schemas",
    "econiq-llm",
    "econiq-data-models",
    "econiq-ingestion",
]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-schemas = { workspace = true }
econiq-llm = { workspace = true }
econiq-data-models = { workspace = true }
econiq-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_agents"]
