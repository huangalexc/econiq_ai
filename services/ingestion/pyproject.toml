[project]
name = "econiq-ingestion"
version = "0.1.0"
description = "Document acquisition, storage and parsing"
requires-python = ">=3.12"
dependencies = [
    "econiq-ontology",
    "econiq-data-models",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
]

[project.optional-dependencies]
# Parsers for real-world formats. The pipeline degrades to the stdlib HTML
# extractor without them, so tests and CI do not need the native wheels.
parsers = ["trafilatura>=1.12", "pymupdf>=1.24"]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-data-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econiq_ingestion"]
