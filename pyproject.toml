[project]
name = "econiq-ai"
version = "0.1.0"
description = "Evidence-backed, Process-first investment research platform"
requires-python = ">=3.12"
dependencies = [
    "econiq-ontology",
    "econiq-schemas",
    "econiq-data-models",
    "econiq-llm",
    "econiq-ingestion",
    "econiq-agents",
    "econiq-graph",
    "econiq-orchestration",
    "econiq-eval",
    "econiq-market",
    "econiq-api",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-psycopg2>=2.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/ontology",
    "packages/schemas",
    "packages/data-models",
    "packages/llm",
    "services/ingestion",
    "services/agents",
    "services/graph",
    "services/orchestration",
    "services/eval",
    "services/market",
    "apps/api",
]

[tool.uv.sources]
econiq-ontology = { workspace = true }
econiq-schemas = { workspace = true }
econiq-data-models = { workspace = true }
econiq-llm = { workspace = true }
econiq-ingestion = { workspace = true }
econiq-agents = { workspace = true }
econiq-graph = { workspace = true }
econiq-orchestration = { workspace = true }
econiq-eval = { workspace = true }
econiq-market = { workspace = true }
econiq-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/data-models/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "ANN"]
ignore = [
    "ANN401",
    "B008",
    # Spec references are written with en dashes ("ontology §4–§6"); keeping
    # them matches the source documents.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
# Text normalization is *about* curly quotes, en dashes and non-breaking
# spaces: the literals are the subject, not a typo.
"**/parsing.py" = ["RUF001"]
"**/document_agents.py" = ["RUF001"]
"**/test_parsing.py" = ["RUF001"]
"**/test_document_agents.py" = ["RUF001"]
# Journal summaries render deltas the way PRD §21 shows them ("− weakened").
"**/process_persistence.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/ontology/src",
    "packages/schemas/src",
    "packages/data-models/src",
    "packages/llm/src",
    "services/ingestion/src",
    "services/agents/src",
    "services/graph/src",
    "services/orchestration/src",
    "services/eval/src",
    "services/market/src",
    "apps/api/src",
]
explicit_package_bases = true
disallow_untyped_decorators = false
# Type-check the contract, not the tests: strict mode on test helpers costs more
# in annotation noise than it catches. Tests are still linted and run.
exclude = ["/tests/", "/alembic/versions/"]

[[tool.mypy.overrides]]
# Optional extras and untyped SDKs. Every import here is guarded at runtime.
module = ["anthropic.*", "pgvector.*", "boto3.*", "botocore.*", "trafilatura.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "apps"]
# Several packages have a tests/conftest.py; importlib mode keeps their module
# names distinct without scattering __init__.py files through the test trees.
addopts = "--import-mode=importlib"
consider_namespace_packages = true
asyncio_mode = "auto"
markers = [
    "integration: requires the docker-compose stack (Postgres/MinIO/Redis)",
]
filterwarnings = ["error::DeprecationWarning"]

